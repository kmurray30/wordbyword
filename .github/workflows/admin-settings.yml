name: "Admin: update live /settings (deployed Railway app)"

# Manual-only tool for flipping the live model_provider / word_weighting_
# enabled toggle (GET/PUT /settings) without using the app's own UI - the
# dev sandbox this app was built in can't reach *.up.railway.app at all
# (its egress policy blocks that domain outright, same as e2e-check.yml's
# own note), so an action here that needs to hit the deployed backend runs
# on a GitHub-hosted runner instead, which has normal internet access.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend base URL"
        default: "https://server-production-f688.up.railway.app"
      model_provider:
        description: "local | openai - leave blank to leave unchanged"
      word_weighting_enabled:
        description: "true | false - leave blank to leave unchanged"
  # workflow_dispatch needs the workflow file discovered on the default
  # branch first, which this repo doesn't use - push (scoped to this
  # workflow's own files) is how runs actually get kicked off, same as
  # e2e-check.yml/chat-sample.yml.
  push:
    branches: ["claude/language-learning-chat-app-krn12w"]
    paths:
      - ".github/workflows/admin-settings.yml"
      - ".github/scripts/admin-settings.mjs"

jobs:
  update-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://server-production-f688.up.railway.app' }}
      MODEL_PROVIDER: ${{ github.event.inputs.model_provider }}
      WORD_WEIGHTING_ENABLED: ${{ github.event.inputs.word_weighting_enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update /settings
        run: node .github/scripts/admin-settings.mjs
