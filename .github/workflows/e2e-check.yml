name: E2E check (deployed Railway app)

# GitHub's runners have normal internet access, unlike the dev sandbox this
# app was built in (its egress policy blocks *.up.railway.app outright), so
# this is the only place that can actually validate the deployed app end to
# end. workflow_dispatch is the intended trigger, but GitHub only lets you
# dispatch a workflow via API once it's been discovered on the default
# branch - until this lands on main, the `push` trigger (scoped to this
# workflow's own files, so it doesn't fire on unrelated app commits) is how
# runs actually get kicked off.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend base URL"
        default: "https://server-production-f688.up.railway.app"
      frontend_url:
        description: "Frontend base URL"
        default: "https://web-production-63d72.up.railway.app"
  push:
    branches: ["claude/language-learning-chat-app-krn12w"]
    paths:
      - ".github/workflows/e2e-check.yml"
      - ".github/scripts/e2e-check.mjs"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://server-production-f688.up.railway.app' }}
      FRONTEND_URL: ${{ github.event.inputs.frontend_url || 'https://web-production-63d72.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright@1.48
          npx playwright install --with-deps chromium

      - name: Run end-to-end check
        run: node .github/scripts/e2e-check.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-*.png
          if-no-files-found: ignore
