name: Chat quality sample (deployed Railway app)

# Manual-only tool for comparing reply quality across config changes (e.g.
# WORD_WEIGHTING_ENABLED on vs off) - sends several distinct conversational
# turns and prints every reply. No browser/TTS checks, unlike e2e-check.yml;
# this is purely about eyeballing chat output, run on demand.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend base URL"
        default: "https://server-production-f688.up.railway.app"
      label:
        description: "Label to prefix log lines with (e.g. weighting-off)"
        default: "run"
  # workflow_dispatch needs the workflow file discovered on the default
  # branch first, which this repo doesn't use - push (scoped to this
  # workflow's own files) is how runs actually get kicked off, same as
  # e2e-check.yml. Note: a push to this branch rebuilds all 3 Railway
  # services, so a run triggered immediately after a push can race a
  # model-server restart - check its deploy settled first.
  push:
    branches: ["claude/language-learning-chat-app-krn12w"]
    paths:
      - ".github/workflows/chat-sample.yml"
      - ".github/scripts/chat-sample.mjs"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://server-production-f688.up.railway.app' }}
      SAMPLE_LABEL: ${{ github.event.inputs.label || 'run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sample chat replies
        run: node .github/scripts/chat-sample.mjs
